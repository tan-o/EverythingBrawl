name: setup-godot
description: 下载官方 Godot 编辑器（Linux）与可选的导出模板，并缓存。
inputs:
  version:
    description: Godot 版本，如 4.7.2
    required: true
  templates:
    description: 是否安装导出模板
    default: "false"
runs:
  using: composite
  steps:
    - name: 缓存 Godot
      uses: actions/cache@v4
      with:
        path: ~/godot-bin
        key: godot-editor-${{ inputs.version }}

    - name: 缓存导出模板
      if: inputs.templates == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates/${{ inputs.version }}.stable
        key: godot-templates-${{ inputs.version }}

    - name: 下载
      shell: bash
      run: |
        set -e
        V=${{ inputs.version }}
        mkdir -p ~/godot-bin
        if [ ! -f ~/godot-bin/godot ]; then
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${V}-stable_linux.x86_64 ~/godot-bin/godot
        fi
        chmod +x ~/godot-bin/godot
        echo "$HOME/godot-bin" >> "$GITHUB_PATH"
        T=~/.local/share/godot/export_templates/${V}.stable
        if [ "${{ inputs.templates }}" = "true" ] && [ ! -f "$T/version.txt" ]; then
          curl -sSL -o /tmp/tpl.tpz "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
          mkdir -p "$T"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$T/"
          rm -rf /tmp/tpl /tmp/tpl.tpz
        fi
